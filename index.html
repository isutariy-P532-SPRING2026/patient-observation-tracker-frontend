<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Observation Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f7fa;
        }

        h1 {
            color: #2c3e50;
        }

        nav a {
            margin-right: 16px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #ecf0f1;
        }

        tr:hover td {
            background: #f0f4f8;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #2980b9;
        }

        .form-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            margin: 24px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin: 4px 0 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        a.view-link {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">🏥 Patients</a>
        <a href="catalogue.html">📚 Catalogue</a>
        <a href="logs.html">📋 Logs</a>
    </nav>
    <h1>Patient Observation Tracker</h1>

    <div class="form-card">
        <h2>Add New Patient</h2>
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Jane Doe">
        <label>Date of Birth</label>
        <input id="dob" type="date">
        <label>Note</label>
        <textarea id="note" rows="2" placeholder="Optional clinical note..."></textarea>
        <button class="btn" onclick="createPatient()">Add Patient</button>
    </div>

    <h2>All Patients</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Date of Birth</th>
                <th>Note</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="patient-list"></tbody>
    </table>

    <script>
        const API = 'https://patient-observation-tracker-backend-cad5.onrender.com';
        async function loadPatients() {
            const res = await fetch(`${API}/api/patients`);
            const patients = await res.json();
            const tbody = document.getElementById('patient-list');
            tbody.innerHTML = patients.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.fullName}</td>
          <td>${p.dateOfBirth || ''}</td>
          <td>${p.note || ''}</td>
          <td><a class="view-link" href="patient.html?id=${p.id}">View →</a></td>
        </tr>`).join('');
        }

        async function createPatient() {
            const body = {
                fullName: document.getElementById('name').value,
                dateOfBirth: document.getElementById('dob').value || null,
                note: document.getElementById('note').value
            };
            await fetch(`${API}/api/patients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            document.getElementById('name').value = '';
            document.getElementById('dob').value = '';
            document.getElementById('note').value = '';
            loadPatients();
        }

        loadPatients();
    </script>
</body>

</html>
